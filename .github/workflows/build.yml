name: Build AutoClick Dylib

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Dear ImGui
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui.git

      - name: Test LevelRecognizer parser
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -I. tests/LevelRecognizerTests.cpp -o /tmp/level-recognizer-tests
          /tmp/level-recognizer-tests

      - name: Test TargetClassifier
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -I. tests/TargetClassifierTests.cpp -o /tmp/target-classifier-tests
          /tmp/target-classifier-tests

      - name: Test HPAnalyzer
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -I. tests/HPAnalyzerTests.cpp -o /tmp/hp-analyzer-tests
          /tmp/hp-analyzer-tests

      - name: Inspect reference images with Apple Vision OCR
        run: |
          unzip -q Picture.zip -d /tmp/picture-reference
          clang++ -std=c++17 -fobjc-arc -framework Foundation -framework Vision -framework ImageIO -framework CoreGraphics tests/ReferenceImageOCR.mm -o /tmp/reference-image-ocr
          find /tmp/picture-reference -type f \\( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' \\) -print0 | xargs -0 /tmp/reference-image-ocr

      - name: Compile AutoClick.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -isysroot $SDK -miphoneos-version-min=13.0 \
          -std=c++17 -fobjc-arc -dynamiclib \
          -I. -Iimgui -Iimgui/backends \
          -framework UIKit -framework Foundation -framework CoreGraphics \
          -framework QuartzCore -framework Metal -framework MetalKit \
          -framework Accelerate -framework IOKit -framework Vision \
          -install_name @rpath/AutoClick.dylib \
          -lc++ \
          -o AutoClick.dylib \
          AutoClick.mm LevelRecognizer.mm \
          imgui/imgui.cpp imgui/imgui_draw.cpp imgui/imgui_tables.cpp imgui/imgui_widgets.cpp \
          imgui/backends/imgui_impl_metal.mm

      - name: Upload AutoClick.dylib
        uses: actions/upload-artifact@v4
        with:
          name: AutoClick.dylib
          path: AutoClick.dylib

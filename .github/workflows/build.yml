name: Build dylib
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile AutoClick.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=13.0 -std=c++17 -fobjc-arc -dynamiclib \
            -framework UIKit -framework Foundation -framework CoreGraphics \
            -framework QuartzCore -framework Metal -framework MetalKit \
            -framework Accelerate \
            -install_name @rpath/AutoClick.dylib \
            -o AutoClick.dylib AutoClick.mm
      - name: Upload AutoClick.dylib
        uses: actions/upload-artifact@v4
        with:
          name: AutoClick.dylib
          path: AutoClick.dylib

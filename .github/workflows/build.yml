name: Build dylib
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile AutoClick.dylib
        run: make
      - name: Upload AutoClick.dylib
        uses: actions/upload-artifact@v4
        with:
          name: AutoClick.dylib
          path: AutoClick.dylib
